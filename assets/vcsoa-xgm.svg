<text x="87" y="876" font-family="Arial" font-size="19" font-weight="700" fill="#24455e">Steady-state concept:</text>
<text x="282" y="876" font-family="Arial" font-size="19" fill="#426079">At fixed bias, stronger control illumination can reduce carrier density and signal gain through XGM.</text>
<text x="87" y="905" font-family="Arial" font-size="17" fill="#60778a">Schematic only. Polarization-dependent gain, cavity phase, ASE, spatial nonuniformity and relaxation dynamics require measurement.</text>
