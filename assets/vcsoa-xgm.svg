<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="960" viewBox="0 0 1700 960" role="img" aria-labelledby="title desc">
<title id="title">VCSOA cross-gain modulation: conceptual carrier dynamics</title>
<desc id="desc">Four states: no bias, forward bias and carrier injection, control illumination depletes carriers through stimulated emission, and the signal experiences control-dependent gain. This is a qualitative steady-state schematic, not a measured band diagram. Signal and control share a carrier reservoir; gain depends on device, wavelength, polarization, power and temperature.</desc>
