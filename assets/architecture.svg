<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="870" viewBox="0 0 2200 870" role="img" aria-labelledby="title desc">
<title id="title">All-optical dynamic channel attention: proposed free-space diffractive architecture</title>
<desc id="desc">Concept schematic. Static diffractive feature extraction feeds two-dimensional optical feature channels. A split branch uses optical squeeze and a fixed learned diffractive mixer to generate control light, polarization rotation and top-hat beam shaping; the main optical features and control light meet in a broad-area VCSOA array using cross-gain modulation. The weighted features propagate through a fixed diffractive classifier to a photodetector. No experimental performance is claimed.</desc>
